services:
  postgres:
    image: postgres:18.3
    profiles: ["database"]
    ports:
      - "127.0.0.1:54329:5432"
    environment:
      POSTGRES_DB: rookery
      POSTGRES_USER: rookery
      POSTGRES_PASSWORD: rookery_local
    volumes:
      - rookery-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "rookery", "-d", "rookery"]
      interval: 3s
      timeout: 3s
      retries: 20
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  rookery-postgres:
